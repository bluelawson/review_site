query Reviews($filter: ReviewFilterInput) {
  reviews(filter: $filter) {
    id
    shopName
    castName
    estimatedAge
    bodyType
    bustSize
    heightCm
    personality
    headline
    detail
    serviceHighlights
    castRating
    likesCount
    likedByMe
    isPublished
    status
    remandReason
    damage
    createdAt
    updatedAt
    author {
      id
      name
      userName
      email
    }
  }
}

query Review($id: ID!, $viewerEmail: String) {
  review(id: $id, viewerEmail: $viewerEmail) {
    id
    shopName
    castName
    estimatedAge
    bodyType
    bustSize
    heightCm
    personality
    headline
    detail
    serviceHighlights
    castRating
    likesCount
    likedByMe
    isPublished
    status
    remandReason
    damage
    createdAt
    updatedAt
    author {
      id
      name
      userName
      email
    }
  }
}

mutation CreateReview($input: ReviewInput!) {
  createReview(input: $input) {
