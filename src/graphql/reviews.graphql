query Reviews($filter: ReviewFilterInput) {
  reviews(filter: $filter) {
    id
    shopName
    castName
    estimatedAge
    bodyType
    bustSize
    heightCm
    personality
    headline
    detail
    serviceHighlights
    castRating
    reviewRating
    isPublished
    damage
    createdAt
    updatedAt
    author {
      id
      name
      email
    }
  }
}

query Review($id: ID!) {
  review(id: $id) {
    id
    shopName
    castName
    estimatedAge
    bodyType
    bustSize
    heightCm
    personality
    headline
    detail
    serviceHighlights
    castRating
    reviewRating
    isPublished
    damage
    createdAt
    updatedAt
    author {
      id
      name
      email
    }
  }
}

mutation CreateReview($input: ReviewInput!) {
  createReview(input: $input) {
    id
    shopName
    castName
    estimatedAge
    bodyType
    bustSize
    heightCm
    personality
    headline
    detail
    serviceHighlights
    castRating
    reviewRating
    isPublished
    damage
    createdAt
    updatedAt
    author {
      id
      name
      email
    }
  }
}

mutation DeleteReview($id: ID!) {
  deleteReview(id: $id)
}

mutation SetReviewVisibility($id: ID!, $isPublished: Boolean!) {
  setReviewVisibility(id: $id, isPublished: $isPublished) {
    id
    shopName
    castName
    estimatedAge
    bodyType
    bustSize
    heightCm
    personality
    headline
    detail
    serviceHighlights
    castRating
    reviewRating
    isPublished
    damage
    createdAt
    updatedAt
    author {
      id
      name
      email
    }
  }
}
